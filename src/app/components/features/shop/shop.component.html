<!-- HERO -->
<section class="shop-hero">
  <div class="hero-bg">
    <img src="assets/images/naturaImg.jpg" alt="Fundal natural" />
    <div class="overlay"></div>
  </div>

  <div class="hero-content">
    <div class="brand-card">
      <img class="logo" src="assets/images/logoTerraBucovina.png" alt="Terra Bucovina" />
      <div class="text-content">
        <h1>Terapia Florală Bucovina</h1>
        <p class="motto">Natura cu frumusețile ei este templu divin de vindecare pentru noi.</p>
      </div>
    </div>
  </div>
</section>

<section class="products-section">

  <aside class="categories-sidebar" *ngIf="categories$ | async as categories">
    <h3>Categorii</h3>

    <div class="category-item" *ngFor="let cat of categories">
      <div class="category-header" (click)="toggleCategory(cat.id)">
        <span class="header-text">{{ cat.name }}</span>
        <mat-icon class="arrow" [class.open]="openedCategories.includes(cat.id)">expand_more</mat-icon>
      </div>

      <ul class="subcategory-list" *ngIf="openedCategories.includes(cat.id)">
        <li *ngFor="let p of productsByCategory(cat.id) | async" (click)="goToProduct(p.id)">
          {{ p.name }}
        </li>
      </ul>
    </div>
  </aside>

  <div class="products-grid">

    <div class="filter-bar" *ngIf="categories$ | async as categories">
      <label class="filter-field">
        <span>Categorie</span>
        <select [(ngModel)]="filter.categoryId" (ngModelChange)="onFilterChange()">
          <option [ngValue]="null">Toate</option>
          <option *ngFor="let cat of categories" [ngValue]="cat.id">{{ cat.name }}</option>
        </select>
      </label>

      <label class="filter-field">
        <span>Preț min (RON)</span>
        <input type="number" min="0" [(ngModel)]="filter.minPrice" (ngModelChange)="onFilterChange()" />
      </label>

      <label class="filter-field">
        <span>Preț max (RON)</span>
        <input type="number" min="0" [(ngModel)]="filter.maxPrice" (ngModelChange)="onFilterChange()" />
      </label>

      <label class="filter-field">
        <span>Sortare</span>
        <select [(ngModel)]="filter.sortBy" (ngModelChange)="onFilterChange()">
          <option value="default">Implicit</option>
          <option value="price-asc">Preț crescător</option>
          <option value="price-desc">Preț descrescător</option>
          <option value="popularity">Popularitate</option>
        </select>
      </label>

      <button type="button" class="filter-reset" (click)="resetFilter()">Resetează filtrele</button>
    </div>

    <div class="grid-wrapper">
      <div *ngFor="let p of filteredProducts$ | async" class="grid-item">
        <app-product-card [product]="p"></app-product-card>
      </div>
    </div>
  </div>

</section>
