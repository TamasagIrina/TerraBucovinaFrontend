<section class="account-settings" *ngIf="user">

  <header class="page-header">
    <h2>Setări cont</h2>
    <p class="subtitle">Modifică informațiile tale de bază.</p>
  </header>

  <form #settingsForm="ngForm" (ngSubmit)="updateUser(settingsForm)">
    
    <!-- CARD: User Info -->
    <div class="card">
      <h3>Informații cont</h3>

      <label class="field">
        <span>Username</span>
        <input type="text" name="username" [(ngModel)]="user.username" required />
      </label>

      <label class="field">
        <span>Nume complet</span>
        <input type="text" name="fullName" [(ngModel)]="user.fullName" />
      </label>

      <label class="field">
        <span>Adresă</span>
        <input type="text" name="address" [(ngModel)]="user.address" />
      </label>

      <label class="field">
        <span>Email</span>
        <input type="email" name="email" [ngModel]="user.email" disabled />
      </label>
    </div>

    <!-- CARD: Password -->
    <div class="card">
      <h3>Parolă</h3>
      <p class="subtitle">
        Parola se poate schimba doar din pagina de autentificare, folosind linkul „Ai uitat parola?".
      </p>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button class="btn primary" type="submit">Salvează modificările</button>
    </div>

  </form>

  <!-- CARD: My reviews -->
  <div class="card reviews-card">
    <h3>Recenziile mele</h3>

    <div class="review-row" *ngFor="let review of (myReviews$ | async)">
      <div class="review-row-info">
        <div class="rating">
          <span *ngFor="let s of [1,2,3,4,5]" [class.filled]="s <= review.stars">★</span>
        </div>
        <p class="review-body">{{ review.body }}</p>
      </div>
      <div class="review-row-actions">
        <button class="btn" type="button" (click)="editReview(review)">Editează</button>
        <button class="btn danger" type="button" (click)="deleteReview(review.id)">Șterge</button>
      </div>
    </div>

    <p *ngIf="(myReviews$ | async)?.length === 0" class="subtitle">Nu ai scris încă nicio recenzie.</p>
  </div>
</section>
