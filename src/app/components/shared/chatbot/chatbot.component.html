<!-- Floating toggle button -->
<button class="chat-fab" (click)="toggle()" [attr.aria-label]="open() ? 'Închide chat' : 'Deschide chat'">
  <span *ngIf="!open()">🌿</span>
  <span *ngIf="open()">✕</span>
</button>

<!-- Chat panel -->
<div class="chat-panel" *ngIf="open()">
  <div class="chat-header">
    <span class="title">Asistent Terra Bucovina</span>
    <span class="subtitle">Recomandări de produse</span>
  </div>

  <div class="chat-body">
    <div class="msg" *ngFor="let m of messages()" [ngClass]="m.from">
      <div class="bubble">
        <p class="text">{{ m.text }}</p>

        <div class="products" *ngIf="m.products?.length">
          <a class="product" *ngFor="let p of m.products" [routerLink]="['/details', p.id]" (click)="toggle()">
            <span class="name">{{ p.name }}</span>
            <span class="price">{{ p.price }} RON</span>
          </a>
        </div>
      </div>
    </div>

    <div class="msg bot" *ngIf="loading()">
      <div class="bubble typing">Scriu răspunsul...</div>
    </div>
  </div>

  <form class="chat-input" (ngSubmit)="send()">
    <input type="text" [(ngModel)]="draft" name="draft" placeholder="Scrie problema ta..." autocomplete="off" />
    <button type="submit" [disabled]="loading() || !draft.trim()">Trimite</button>
  </form>
</div>
